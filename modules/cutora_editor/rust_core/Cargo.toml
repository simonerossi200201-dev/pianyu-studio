[package]
name = "cutora_rust_core"
version = "3.0.0"
edition = "2021"
description = "CUTORA Native Rust High-Performance Memory Arena, Waveform, Glass Blur & Kernel Memory Governor"

[lib]
name = "cutora_rust_core"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
