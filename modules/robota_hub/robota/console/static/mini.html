<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Robota 桌面助手</title>
  <link rel="icon" href="/static/robota.ico">
  <link rel="stylesheet" href="/static/mini.css">
</head>
<body>
  <!-- Top bar -->
  <header id="header">
    <div class="character-card">
      <div class="avatar-wrap" id="avatarBtn" title="点击更换形象">
        <img id="avatarImg" src="/static/avatar.png" alt="Robota" />
        <span class="online-dot" title="Gemini Ultra 已就绪"></span>
      </div>
      <div class="info">
        <div class="name-row">
          <span class="name">Robota</span>
          <span class="chip-brain" id="brainChip">Gemini 3.8</span>
        </div>
        <div class="status-sub" id="statusSub">随时待命 · 点击头像换装</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="openFullBtn" title="打开完整控制台">⛶</button>
    </div>
  </header>

  <!-- Call Mode Action Strip -->
  <div class="call-strip">
    <button class="call-btn" id="callModeBtn">
      <span class="call-icon">📞</span>
      <span id="callModeText">开启连麦通话 (免按键持续交流)</span>
    </button>
  </div>

  <!-- Call Active Banner -->
  <div class="call-banner hidden" id="callBanner">
    <span class="call-pulse">🟢</span>
    <span class="call-status" id="callStatusText">连麦中 · 👂 正在倾听...</span>
    <button class="btn-hangup" id="hangupBtn">挂断</button>
  </div>

  <!-- Workflow / Recipe Action Strip -->
  <div class="workflow-strip">
    <button class="wf-btn" id="recordBtn">
      <span class="dot"></span>
      <span id="recordBtnText">⏺ 记录流程</span>
    </button>
    <button class="wf-btn secondary" id="recipesBtn">
      <span>📂 载入流程</span>
    </button>
    <button class="wf-btn ghost" id="changeAvatarBtn" title="更换女孩形象">
      <span>🎨 换装</span>
    </button>
  </div>

  <!-- Recording active banner -->
  <div class="record-banner hidden" id="recordBanner">
    <span class="pulse-icon">🔴</span>
    <span class="banner-text">正在记录你的操作与对话步骤...</span>
    <button class="btn-xs" id="stopRecordBannerBtn">保存</button>
  </div>

  <!-- Chat container -->
  <main id="chatBox">
    <div class="welcome-card" id="welcomeCard">
      <div class="welcome-hello">你好，Luca！✨</div>
      <div class="welcome-desc">我是你的通用 AI 助手 Robota。点击下方 🎤 直接说话，或打字下达任务。点击「⏺ 记录流程」可以把你的工作步骤教给我。</div>
    </div>
    <div id="messages"></div>
  </main>

  <!-- Footer Input Area -->
  <footer id="footer">
    <div class="input-controls">
      <label class="toggle-tts" title="自动朗读回复">
        <input type="checkbox" id="ttsToggle" checked>
        <span>🔊 朗读回复</span>
      </label>
      <span class="voice-badge" id="voiceBadge" title="已启用写实真人女声 (晓晓 / Ava / Elsa)">✨ 写实真人女声</span>
      <div class="vram-pill" id="vramPill" title="显存状态">显存: 正常</div>
    </div>
    <div class="input-row">
      <button class="mic-btn" id="micBtn" title="按住或点击开始说话">
        <span class="mic-icon">🎤</span>
      </button>
      <div class="textarea-wrap">
        <textarea id="textInput" rows="1" placeholder="说话或打字... Enter 发送 (#私密 走本地)"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" title="发送">
        <span>➤</span>
      </button>
    </div>
  </footer>

  <!-- Modal: Recipes List -->
  <div class="modal-overlay hidden" id="recipesModal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3>📂 已学习的工作流程</h3>
        <button class="close-btn" id="closeRecipesBtn">✕</button>
      </div>
      <div class="modal-body" id="recipesList">
        <div class="empty-tip">暂无保存的流程，点击「⏺ 记录流程」开始录制教学！</div>
      </div>
    </div>
  </div>

  <!-- Modal: Save Recipe -->
  <div class="modal-overlay hidden" id="saveModal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3>💾 保存当前工作流程</h3>
        <button class="close-btn" id="closeSaveBtn">✕</button>
      </div>
      <div class="modal-body">
        <label class="form-label">为此流程起一个名字：</label>
        <input type="text" id="recipeNameInput" class="form-input" placeholder="例如：视频导出与网盘同步 / 表格整理..." />
        <p class="form-hint">AI 会自动分析刚才的操作交互，提炼成标准化 SOP 步骤保存在「流程库」和记忆中。</p>
        <div class="modal-actions">
          <button class="btn cancel-btn" id="cancelSaveBtn">取消</button>
          <button class="btn confirm-btn" id="confirmSaveBtn">提炼并保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Avatar Selector -->
  <div class="modal-overlay hidden" id="avatarModal">
    <div class="modal-dialog">
      <div class="modal-head">
        <h3>🎨 选择你喜欢的小女孩形象</h3>
        <button class="close-btn" id="closeAvatarBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="avatar-grid" id="avatarGrid">
          <!-- Filled by JS -->
        </div>
        <p class="form-hint" style="text-align:center;">选中后将立即换装，并自动同步更新桌面图标与窗口。</p>
      </div>
    </div>
  </div>

  <script src="/static/mini.js"></script>
</body>
</html>
