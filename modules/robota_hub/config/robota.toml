# Robota global settings

[console]
port = 9600

[voice]
port = 9611

[local]
# Agent work (accuracy first)
model = "muse-glimmer"
# Chat / tutor (speed first, fits fully in 16 GB VRAM)
fast_model = "gemma4:12b"
ollama = "http://localhost:11434"
num_ctx = 32768

[router]
# Default brain in "auto" mode: "agy" (Gemini Ultra, cloud, saves GPU) or "local" (Ollama)
default_brain = "agy"
# Local agent engine (route local_agent): "smol" = smolagents ToolCallingAgent (default), "antigravity" = old loop
agent_engine = "smol"
smol_model = "gemma4:12b"   # or "gemma4:26b" / "muse-glimmer"
smol_max_steps = 10

[agy]
# General chat & tasks: fast, high quality, low quota usage
model = "gemini-3.8-flash-medium"
# Coding / complex project changes
code_model = "claude-opus-5-5-high"
timeout_min = 120

[tutor]
# Fill in your target language, e.g. "Italian", "German", "English"
target_language = ""
native_language = "Chinese"
level = "auto"
