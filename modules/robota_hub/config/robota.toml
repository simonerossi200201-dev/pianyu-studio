# Robota global settings (片语工作室 D:\0_LTX 统一版 — 默认零 Token 本地优先)

[console]
port = 9600

[voice]
port = 9611

[local]
# 默认本地模型统一使用本机 Google Gemma 4 (不耗费任何云端 Token，物理离线运行)
model = "gemma4:12b"
fast_model = "gemma4:12b"
ollama = "http://127.0.0.1:11434"
num_ctx = 32768

[router]
# 默认优先使用本地 L0 确定性规则 + L1 本地模型 (0 云端 Token 消耗)
default_brain = "local"
agent_engine = "smol"
smol_model = "gemma4:12b"
smol_max_steps = 10

[agy]
model = "gemini-3.8-flash-medium"
code_model = "claude-opus-5-5-high"
timeout_min = 120

[tutor]
target_language = ""
native_language = "Chinese"
level = "auto"
